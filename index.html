<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VP Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 30px;
        }
        .info-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            text-align: left;
            font-size: 15px;
            line-height: 1.7;
        }
        .info-box strong {
            color: #00d2ff;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: #fff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 210, 255, 0.45);
        }
        .note {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">VP Community</div>
        <div class="subtitle">অফিসিয়াল রেজিস্ট্রেশন লিংক</div>

        <div class="info-box">
            <div><strong>নাম:</strong> VP community</div>
            <div><strong>পাসওয়ার্ড:</strong> 1122</div>
            <div style="margin-top: 10px; word-break: break-all;">
                <strong>লিংক:</strong><br>
                https://dkwin9.com/#/register?invitationCode=323872130590
            </div>
        </div>

        <a href="https://dkwin9.com/#/register?invitationCode=323872130590" 
           class="btn" 
           target="_blank" 
           rel="noopener noreferrer">
            এখনই রেজিস্টার করুন
        </a>

        <div class="note">
            VP Community • Invitation Code: 323872130590
        </div>
    </div>
</body>
</html>
